<!DOCTYPE html>

{{- $data := hugo.Data.items -}}
{{- $itemNode := resources.Get "itemNode.js" -}}
{{- $nodeStyle := resources.Get "nodeStyle.css" -}}

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="utf-8" />
  <title>C:U Recipe Planner</title>
  <link rel="stylesheet" href="{{ $nodeStyle.RelPermalink }}">
  <script src="{{ $itemNode.RelPermalink }}"></script>
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0">
  <script>
    function SearchData(itemName) {   // Returns an array of JSON objects with names containing the given string
      let data = {{ $data }};
      let dataList = [];
     
      for (let i = 0; i < data.length; i++) {
        if (data[i].name.includes(itemName)) {
          dataList.push(data[i]);
        }
      }

      return dataList;
    }
    function DisplayRecipes() {       // Retrieve and display all recipes containing the given string in their name
      var recipeName = document.getElementById("recipe").value;
      var listDiv = document.getElementById("recipe-list");
      var text = "";
      var list = [];  // List of JSON objects with names containing the input recipeName string

      listDiv.innerHTML = '';

      list = SearchData(recipeName);
       
      for (let i = 0; i < list.length; i++) {
        let itemDiv = document.createElement("div");
        let listItem = document.createTextNode(list[i].name);

        itemDiv.setAttribute("onclick", "SelectItem(this)");

        itemDiv.appendChild(listItem);
        listDiv.appendChild(itemDiv);
      }
    }
    function SelectItem(element) {    // Get the relevant data for a given item and generate a new node for it. If the item name applies to multiple items, uses the first item.
      let itemName = element.textContent;
      let itemList = SearchData(itemName);

      CreateNode(itemList[0]);
    }
    function CreateNode(item) {       // Generate a new node for a given item
      var node = new ItemNode(item, 100, 200);

      node.GenerateNode();
      document.getElementById("new-nodes").appendChild(node.node);
    }
  </script>
  <noscript>Sorry, your browser does not support JavaScript!</noscript>
</head>
<body>
  <a href="{{ .Site.BaseURL | relLangURL }}">home</a>
  <br />
  <br />
  <label for="reqRecipe">Choose a recipe: </label>
  <input type="text" id="recipe" size="20" name="reqRecipe" oninput="DisplayRecipes()">
  <br>
  <div id="recipe-list">

  </div>
  <br />
  <div id="new-nodes">

  </div>
</body>
</html>
